name: Package and release

# Tag-driven: the tag name becomes the release version, so pushing v1.61
# publishes 1.61. Ordinary commits do nothing.
#
# workflow_dispatch is the dry run -- it packages and uploads the zip as a
# build artifact but passes -d, so nothing reaches CurseForge. Use it to check
# what ends up in the zip before burning a real version number, since a
# CurseForge file is visible to players the moment it uploads.
on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The packager reads tag history to work out the version and to build
          # the changelog range, so a shallow clone is not enough.
          fetch-depth: 0

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        with:
          args: ${{ github.event_name == 'workflow_dispatch' && '-d' || '' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      # Only on a dry run -- a real release already has the zip attached to it.
      - name: Upload the zip for inspection
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Squizzumables-dryrun
          path: .release/*.zip
          if-no-files-found: error
