name: Package and release

# Tag-driven: the tag name becomes the release version, so pushing v1.61
# publishes 1.61. Ordinary commits do nothing.
#
# workflow_dispatch is the dry run -- it packages but passes -d, so nothing
# reaches CurseForge. Use it to check the build before burning a real version
# number, since a CurseForge file is visible to players the moment it uploads.
on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The packager reads tag history to work out the version and to build
          # the changelog range, so a shallow clone is not enough.
          fetch-depth: 0

      # Reports whether the secrets reach the job at all, without revealing
      # them -- only their length, and GitHub masks the values regardless.
      # release.sh prints "[token set]" only when its token variable is
      # non-empty, and CurseForge was coming up bare while GitHub was fine.
      - name: Check secret visibility
        if: github.event_name == 'workflow_dispatch'
        env:
          TOK_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TOK_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          echo "secrets.CF_API_TOKEN length: ${#TOK_TOKEN}"
          echo "secrets.CF_API_KEY   length: ${#TOK_KEY}"
          if [ -z "$TOK_TOKEN" ] && [ -z "$TOK_KEY" ]; then
            echo "NEITHER secret is reaching this job."
          fi

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        with:
          args: ${{ github.event_name == 'workflow_dispatch' && '-d' || '' }}
        env:
          # release.sh tries CF_API_KEY first, then CF_API_TOKEN. Both are wired
          # up so the secret works under either name.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Show what the packager produced
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          echo "===== .release ====="
          ls -laR .release || echo "(no .release directory)"

      - name: Upload the build for inspection
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Squizzumables-dryrun
          path: .release/**
          if-no-files-found: warn
          # .release is a hidden directory and upload-artifact skips hidden
          # paths unless told otherwise.
          include-hidden-files: true
